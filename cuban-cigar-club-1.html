<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuban Cigar Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&display=swap">
<style>
:root{--bg:#FBF7EC;--surface:#FFFDF6;--ink:#10332B;--muted:#5D7A70;--em:#0B6B52;--em2:#064A3A;--line:#E3DCC4;--warn:#B4551A;--on:#FBF7EC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07261F;--surface:#0C3329;--ink:#F3EDD9;--muted:#9DB8AE;--em:#2FB38C;--em2:#1E8A6A;--line:#1B4A3D;--warn:#E8925A;--on:#04271F}}
:root[data-theme="dark"]{--bg:#07261F;--surface:#0C3329;--ink:#F3EDD9;--muted:#9DB8AE;--em:#2FB38C;--em2:#1E8A6A;--line:#1B4A3D;--warn:#E8925A;--on:#04271F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{background:var(--em2);color:#FBF7EC;padding:20px 16px;text-align:center;border-radius:0 0 18px 18px}
.logo{width:80px;height:80px;border-radius:50%;display:block;margin:0 auto 8px;border:2px solid rgba(251,247,236,.4)}
header h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;letter-spacing:1px;direction:ltr}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
nav{display:flex;gap:6px;margin:14px 0}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--em);color:var(--on);border-color:var(--em)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.full{grid-column:1/-1}
.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--em);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--em);border:1px solid var(--em)}
.btn.sm{padding:6px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--em);color:var(--on);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{white-space:nowrap;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--em);color:var(--on);border-color:var(--em)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--em);color:var(--em)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
h2{font-size:17px;margin:0 0 10px}
.empty{text-align:center;color:var(--muted);padding:20px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.sec{display:none}.sec.on{display:block}
</style>
</head>
<body>

<div class="wrap">
<nav id="nav">
<button data-t="orders" class="on">الطلبات</button>
<button data-t="stock">المخزون</button>
<button data-t="offers">العروض</button>
</nav>

<section id="orders" class="sec on">
<div class="stats"><div class="stat"><b id="sNew">0</b>طلبات جديدة</div><div class="stat"><b id="sSum">0</b>إجمالي الطلبات (د.إ)</div></div>
<div class="card"><h2>طلب جديد</h2>
<div class="grid">
<input id="oName" placeholder="اسم الزبون">
<input id="oPhone" placeholder="رقم الهاتف" inputmode="tel">
<input id="oProd" class="full" placeholder="المنتج" list="prodList">
<datalist id="prodList"></datalist>
<input id="oQty" type="number" min="1" value="1" placeholder="الكمية">
<input id="oPrice" type="number" min="0" placeholder="سعر الوحدة (د.إ)">
<select id="oStatus" class="full"></select>
<button class="btn full" id="addOrder">إضافة الطلب</button>
</div></div>
<div class="chips" id="chips"></div>
<div id="orderList"></div>
</section>

<section id="stock" class="sec">
<div class="card"><h2>منتج جديد</h2>
<div class="grid">
<input id="pName" class="full" placeholder="اسم المنتج">
<input id="pQty" type="number" min="0" placeholder="الكمية">
<input id="pMin" type="number" min="0" placeholder="حد التنبيه">
<button class="btn full" id="addStock">إضافة للمخزون</button>
</div></div>
<div id="stockList"></div>
</section>

<section id="offers" class="sec">
<div class="card"><h2>عرض جديد</h2>
<div class="grid">
<input id="fTitle" class="full" placeholder="عنوان العرض">
<input id="fProds" class="full" placeholder="المنتجات المشمولة">
<input id="fPrice" class="full" placeholder="السعر أو الخصم، مثال: خصم 15%">
<input id="fFrom" type="date"><input id="fTo" type="date">
<button class="btn full" id="addOffer">حفظ العرض</button>
</div>
<p class="note">أرسل العروض لعملائك الحاليين فقط، وتأكد من التزامك بأنظمة الترويج في الإمارات.</p></div>
<div id="offerList"></div>
</section>

<details class="card"><summary>نسخ احتياطي واستعادة</summary>
<p class="muted">البيانات محفوظة على هذا الجهاز فقط. انسخ نسخة احتياطية واحتفظ بها.</p>
<textarea id="bk" rows="3" placeholder="ألصق النسخة الاحتياطية هنا للاستعادة"></textarea>
<div class="row" style="margin-top:8px"><button class="btn sm" id="bkCopy">نسخ البيانات</button><button class="btn sm ghost" id="bkRestore">استعادة</button></div>
</details>
</div>

<script>
var K='ccc-v1',ST=['جديد','قيد التجهيز','تم التوصيل','مدفوع'],S={orders:[],stock:[],offers:[]},flt='الكل';
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){return new Date().toISOString().slice(0,10)}
function copy(t){try{navigator.clipboard.writeText(t).then(function(){alert('تم النسخ')},function(){alert(t)})}catch(e){alert(t)}}

$('oStatus').innerHTML=ST.map(function(s){return'<option>'+s+'</option>'}).join('');
$('nav').onclick=function(e){var t=e.target.dataset.t;if(!t)return;
document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b===e.target)});
document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id===t)})};

function renderOrders(){
$('prodList').innerHTML=S.stock.map(function(p){return'<option value="'+esc(p.name)+'">'}).join('');
$('sNew').textContent=S.orders.filter(function(o){return o.status==='جديد'}).length;
$('sSum').textContent=S.orders.reduce(function(a,o){return a+o.qty*o.price},0);
$('chips').innerHTML=['الكل'].concat(ST).map(function(s){return'<button class="chip'+(s===flt?' on':'')+'" data-f="'+s+'">'+s+'</button>'}).join('');
var L=S.orders.filter(function(o){return flt==='الكل'||o.status===flt});
$('orderList').innerHTML=L.length?L.map(function(o){
return'<div class="card"><div class="row"><b>'+esc(o.name||'بدون اسم')+'</b><span class="tag">'+o.date+'</span></div>'+
'<div class="muted">'+esc(o.prod)+' × '+o.qty+' = '+(o.qty*o.price)+' د.إ</div>'+
(o.phone?'<div class="muted" dir="ltr" style="text-align:right">'+esc(o.phone)+'</div>':'')+
'<div class="row" style="margin-top:8px"><select data-s="'+o.id+'" style="width:auto">'+ST.map(function(s){return'<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
'<button class="btn sm ghost" data-d="'+o.id+'">حذف</button></div></div>'}).join(''):'<div class="empty">لا توجد طلبات</div>'}

$('chips').onclick=function(e){if(e.target.dataset.f){flt=e.target.dataset.f;renderOrders()}};
$('orderList').onchange=function(e){var id=e.target.dataset.s;if(!id)return;S.orders.forEach(function(o){if(o.id===id)o.status=e.target.value});save();renderOrders()};
$('orderList').onclick=function(e){var id=e.target.dataset.d;if(!id||!confirm('حذف الطلب؟'))return;S.orders=S.orders.filter(function(o){return o.id!==id});save();renderOrders()};
$('addOrder').onclick=function(){
var prod=$('oProd').value.trim(),qty=+$('oQty').value||1;
if(!prod){alert('اكتب اسم المنتج');return}
S.orders.unshift({id:uid(),name:$('oName').value.trim(),phone:$('oPhone').value.trim(),prod:prod,qty:qty,price:+$('oPrice').value||0,status:$('oStatus').value,date:today()});
S.stock.forEach(function(p){if(p.name===prod)p.qty=Math.max(0,p.qty-qty)});
['oName','oPhone','oProd','oPrice'].forEach(function(i){$(i).value=''});$('oQty').value=1;
save();renderOrders();renderStock()};

function renderStock(){
$('stockList').innerHTML=S.stock.length?S.stock.map(function(p){var low=p.qty<=p.min;
return'<div class="card row"><div><b>'+esc(p.name)+'</b>'+(low?' <span class="tag warn">كمية قليلة</span>':'')+'<div class="muted">حد التنبيه: '+p.min+'</div></div>'+
'<div class="qty"><button data-m="'+p.id+'">−</button><b>'+p.qty+'</b><button data-p="'+p.id+'">+</button><button data-x="'+p.id+'" style="font-size:13px">حذف</button></div></div>'}).join(''):'<div class="empty">لا توجد منتجات</div>';renderOrders()}
$('stockList').onclick=function(e){var d=e.target.dataset;
if(d.m)S.stock.forEach(function(p){if(p.id===d.m)p.qty=Math.max(0,p.qty-1)});
else if(d.p)S.stock.forEach(function(p){if(p.id===d.p)p.qty++});
else if(d.x){if(!confirm('حذف المنتج؟'))return;S.stock=S.stock.filter(function(p){return p.id!==d.x})}
else return;save();renderStock()};
$('addStock').onclick=function(){var n=$('pName').value.trim();if(!n){alert('اكتب اسم المنتج');return}
S.stock.push({id:uid(),name:n,qty:+$('pQty').value||0,min:+$('pMin').value||0});
['pName','pQty','pMin'].forEach(function(i){$(i).value=''});save();renderStock()};

function offerText(f){return'🌿 Cuban Cigar Club\n'+f.title+'\n'+(f.prods?f.prods+'\n':'')+(f.price?'السعر: '+f.price+'\n':'')+(f.from||f.to?'الفترة: '+(f.from||'')+' إلى '+(f.to||''):'')}
function renderOffers(){
$('offerList').innerHTML=S.offers.length?S.offers.map(function(f){var t=today(),on=(!f.from||f.from<=t)&&(!f.to||f.to>=t);
return'<div class="card"><div class="row"><b>'+esc(f.title)+'</b><span class="tag'+(on?'':' warn')+'">'+(on?'فعّال':'منتهي أو لم يبدأ')+'</span></div>'+
'<div class="muted">'+esc(f.prods)+'</div><div>'+esc(f.price)+'</div><div class="muted">'+(f.from||'')+' → '+(f.to||'')+'</div>'+
'<div class="row" style="margin-top:8px"><button class="btn sm" data-c="'+f.id+'">نسخ النص</button><button class="btn sm ghost" data-w="'+f.id+'">واتساب</button><button class="btn sm ghost" data-r="'+f.id+'">حذف</button></div></div>'}).join(''):'<div class="empty">لا توجد عروض</div>'}
$('offerList').onclick=function(e){var d=e.target.dataset,f;
if(d.c){f=S.offers.filter(function(x){return x.id===d.c})[0];copy(offerText(f))}
else if(d.w){f=S.offers.filter(function(x){return x.id===d.w})[0];window.open('https://wa.me/?text='+encodeURIComponent(offerText(f)),'_blank')}
else if(d.r){if(!confirm('حذف العرض؟'))return;S.offers=S.offers.filter(function(x){return x.id!==d.r});save();renderOffers()}};
$('addOffer').onclick=function(){var t=$('fTitle').value.trim();if(!t){alert('اكتب عنوان العرض');return}
S.offers.unshift({id:uid(),title:t,prods:$('fProds').value.trim(),price:$('fPrice').value.trim(),from:$('fFrom').value,to:$('fTo').value});
['fTitle','fProds','fPrice','fFrom','fTo'].forEach(function(i){$(i).value=''});save();renderOffers()};

$('bkCopy').onclick=function(){copy(JSON.stringify(S))};
$('bkRestore').onclick=function(){try{var d=JSON.parse($('bk').value);if(!d.orders||!d.stock||!d.offers)throw 0;if(!confirm('سيتم استبدال البيانات الحالية. متابعة؟'))return;S=d;save();renderStock();renderOffers();$('bk').value=''}catch(e){alert('النسخة الاحتياطية غير صالحة')}};

renderStock();renderOffers();
</script>
</body>
</html>
